apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nginx-ingress.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nginx-ingress
      app.kubernetes.io/component: controller

  policyTypes:
    - Ingress
    - Egress

  ingress:
    # HTTP/HTTPS traffic from outside the cluster
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443

  egress:
    - {}