apiVersion: v1
kind: ConfigMap
metadata:
  name: ${FRONTEND_SERVICE_NAME}
data:
  PORT: "80"
  APP_PORT: "80"
  APP_DOMAIN: "${APP_DOMAIN}"
  
  KEYCLOAK_URL: "http://${APP_DOMAIN}:${APP_HOST_PORT}${KEYCLOAK_PATH}"
  KEYCLOAK_APP_REALM: "${KEYCLOAK_APP_REALM}"
  KEYCLOAK_APP_CLIENT_ID: "${KEYCLOAK_APP_CLIENT_ID}"
  
  PROFILES_SERVICE_URL: "http://${APP_DOMAIN}:${APP_HOST_PORT}${PROFILES_PATH}"
  INFERENCE_SERVICE_URL: "http://${APP_DOMAIN}:${APP_HOST_PORT}${INFERENCE_PATH}"
  PROFILES_SERVICE_INTERNAL_URL: "http://${PROFILES_SERVICE_NAME}.${PROFILES_NAMESPACE}.svc:${PROFILES_SERVICE_PORT}${PROFILES_PATH}"
  INFERENCE_SERVICE_INTERNAL_URL: "http://${INFERENCE_SERVICE_NAME}.${INFERENCE_NAMESPACE}.svc:${INFERENCE_SERVICE_PORT}${INFERENCE_PATH}"