apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${FRONTEND_SERVICE_NAME}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ${FRONTEND_SERVICE_NAME}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${FRONTEND_SERVICE_NAME}

    spec:
      containers:
        - name: frontend
          image: agi-frontend
          imagePullPolicy: Never
          ports:
            - containerPort: ${FRONTEND_SERVICE_PORT}
          envFrom:
            - configMapRef:
                name: ${FRONTEND_SERVICE_NAME}