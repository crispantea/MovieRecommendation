apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${FRONTEND_SERVICE_NAME}
spec:
  parentRefs:
  - name: default-gateway
    namespace: kgateway-system
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: ${FRONTEND_SERVICE_NAME}
      port: ${FRONTEND_SERVICE_PORT}