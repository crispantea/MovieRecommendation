apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ${INFERENCE_NAMESPACE}

# Useful for `kubectl get all -l app.kubernetes.io/name=frontend` style lookups.
labels:
  - pairs:
      app.kubernetes.io/name: ${INFERENCE_SERVICE_NAME}

resources:
  - ../../base

configMapGenerator:
  - name: ollama-init
    files:
    # This relative path makes us need that workaround seen on the justfile (--load-restrictor LoadRestrictionsNone "manifests/inference-service/overlays/prod")
      - ollama-init.sh=../../../../services/inference-service/ollama-init.sh