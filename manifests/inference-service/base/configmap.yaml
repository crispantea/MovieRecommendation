apiVersion: v1
kind: ConfigMap
metadata:
  name: "${INFERENCE_SERVICE_NAME}"
data:
  # TODO: Find a workaround to use "${INFERENCE_CONTAINER_PORT}", it doesnt work here because of how
  # envsubst acts on the var, it substitues de values but parses the PORT to a number instead of a string
  PORT: "80"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://${OTEL_RELEASE_NAME}.${OTEL_NAMESPACE}.svc:${OTEL_SERVICE_PORT}"
  DISABLE_INFERENCE_SERVICE_METRICS: "false"
  PROFILES_SERVICE_URL: "http://${PROFILES_SERVICE_NAME}.${PROFILES_NAMESPACE}.svc:${PROFILES_SERVICE_PORT}"
  MOVIES_SERVICE_URL: "http://${MOVIES_SERVICE_NAME}.${MOVIES_NAMESPACE}.svc:${MOVIES_SERVICE_PORT}"
  MODEL_SERVER_URL: "http://${INFERENCE_OLLAMA_SERVICE_NAME}:11434"
  MODEL_NAME: "${INFERENCE_OLLAMA_MODEL}"
  KEYCLOAK_ISSUER: "${KEYCLOAK_ISSUER}"
  KEYCLOAK_JWKS_URL: "http://${KEYCLOAK_SERVICE_NAME}.${KEYCLOAK_NAMESPACE}.svc:${KEYCLOAK_SERVICE_PORT}${KEYCLOAK_PATH}/realms/${KEYCLOAK_APP_REALM}/protocol/openid-connect/certs"
  AUDIENCE: "${INFERENCE_AUDIENCE}"