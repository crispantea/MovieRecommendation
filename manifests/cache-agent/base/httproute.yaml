apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${CACHE_SERVICE_NAME}
spec:
  parentRefs:
    - name: default-gateway
      namespace: kgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: ${CACHE_PATH}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: ${CACHE_SERVICE_NAME}
          port: ${CACHE_SERVICE_PORT}