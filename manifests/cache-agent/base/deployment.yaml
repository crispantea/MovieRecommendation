apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${CACHE_SERVICE_NAME}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ${CACHE_SERVICE_NAME}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${CACHE_SERVICE_NAME}

    spec:
      containers:
        - name: cache-agent
          image: ${CACHE_SERVICE_IMAGE}
          imagePullPolicy: Never
          envFrom:
          - configMapRef:
              name: ${CACHE_SERVICE_NAME}