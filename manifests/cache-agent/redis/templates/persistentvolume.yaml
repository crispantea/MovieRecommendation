{{- if .Values.redis.master.persistence.enabled }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: cache-agent-redis
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gcp-pd-retain
  csi:
    driver: pd.csi.storage.gke.io
    volumeHandle: {{ .Values.additional_values.volume_handle }}
    fsType: ext4
{{- end }}
