apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${PROFILES_SERVICE_NAME}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ${PROFILES_SERVICE_NAME}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${PROFILES_SERVICE_NAME}

    spec:
      containers:
        - name: profiles-service
          image: agi-profiles-service
          imagePullPolicy: Never