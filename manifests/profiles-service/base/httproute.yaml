apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${PROFILES_SERVICE_NAME}
spec:
  parentRefs:
  - name: default-gateway
    namespace: kgateway-system
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /profiles
    backendRefs:
    - name: ${PROFILES_SERVICE_NAME}
      port: ${PROFILES_CONTAINER_PORT}