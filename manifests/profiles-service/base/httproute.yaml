apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: profiles-service
spec:
  parentRefs:
  - name: default-gateway
    namespace: kgateway-system
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /profiles
    backendRefs:
    - name: profiles-service
      port: 3000