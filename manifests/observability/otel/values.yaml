opentelemetry-collector:
  mode: deployment

  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.161.0"

  command:
    name: "otelcol-contrib"

  config:
    receivers:
      jaeger: null
      zipkin: null
      prometheus:
        config:
          scrape_configs:
            - job_name: "keycloak-scrapper"
              scrape_interval: 20s
              metrics_path: "/auth/metrics"
              static_configs:
                - targets: ["keycloak-metrics.keycloak.svc:9000"]

    exporters:
      prometheusremotewrite:
        endpoint: http://mimir-gateway.${MIMIR_NAMESPACE}.svc:80/api/v1/push

    processors:
      batch:
        timeout: 20s

    service:
      telemetry: null
      pipelines:
        traces: null
        metrics:
          receivers: [prometheus, otlp]
          processors: [batch]
          exporters: [prometheusremotewrite]
        logs: null

  ports:
    otlp:
      servicePort: ${OTEL_SERVICE_PORT}
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
