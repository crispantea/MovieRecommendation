apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.globalSecrets.auth.configName | default (printf "%s-config" (include "keycloak-wrapper.fullname" .) | trunc 63 | trimSuffix "-") }}
  labels:
    app.kubernetes.io/name: {{ include "keycloak-wrapper.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # Automatically reads realm-export.json from the root of your chart directory
  realm.json: |-
{{ .Files.Get "realm-export.json" | indent 4 }}