apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "common.names.fullname" (dict "Values" .Values.keycloak "Chart" (dict "Name" "keycloak") "Release" .Release) }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  - name: default-gateway
    namespace: kgateway-system
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /auth
    backendRefs:
    - name: {{ include "common.names.fullname" (dict "Values" .Values.keycloak "Chart" (dict "Name" "keycloak") "Release" .Release) }}
      port: 80