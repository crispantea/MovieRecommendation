{{- if .Values.keycloak.postgresql.primary.persistence.enabled }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: keycloak-postgres
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gcp-pd-retain
  csi:
    driver: pd.csi.storage.gke.io
    volumeHandle: {{ .Values.additional_values.volume_handle }}
    fsType: ext4
{{- end }}
