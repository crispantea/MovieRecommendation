name: agi-project
services:
  # ============================================================================================== #
  # ========== Auth Service (Keycloak) =========================================================== #
  # ============================================================================================== #
  auth-service:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: auth-service
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=changeme
      - KC_DB=postgres
      - KC_DB_USERNAME=agi-auth-backend
      - KC_DB_PASSWORD=changeme
      - KC_DB_URL=jdbc:postgresql://auth-service-database:5432/agi-auth-backend
    ports:
      - "8080:8080"
    command: start-dev
    depends_on:
      auth-service-database:
        condition: service_healthy

  auth-service-database:
    # ref: https://hub.docker.com/_/postgres
    image: postgres:18.6
    container_name: auth-service-database
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: agi-auth-backend
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: agi-auth-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 1s
      retries: 5
    ports:
      - "54321:5432"


  # ============================================================================================== #
  # ========== Inference Service ================================================================= #
  # ============================================================================================== #
  inference-service:
    image: agi-inference-service
    build:
      context: ./inference-service
    container_name: inference-service
    environment:
      MODEL_SERVER_URL: http://inference-service-ollama:11434
    ports:
      - "8000:8000"

  inference-service-ollama:
    # ref: https://hub.docker.com/r/ollama/ollama
    image: ollama/ollama:0.34.1
    container_name: inference-service-ollama
    volumes:
      # - ollama_data:/root/.ollama
      - ./inference-service/ollama-init.sh:/ollama-init.sh
    entrypoint: ["/bin/sh", "/ollama-init.sh"]
    ports:
      - "11434:11434"


  # ============================================================================================== #
  # ========== Profiles Catalog Service ========================================================== #
  # ============================================================================================== #
  profiles-service:
    image: agi-profiles-service
    build:
      context: ./profiles-service
    container_name: profiles-service
    environment:
      DATABASE_URL: postgresql://agi-backend:changeme@profiles-service-database:5432/agi-backend
    ports:
      - "3000:3000"
    depends_on:
      profiles-service-database:
        condition: service_healthy

  profiles-service-database:
    # ref: https://hub.docker.com/_/postgres
    image: postgres:18.6
    container_name: profiles-service-database
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    environment:
      POSTGRES_USER: agi-backend
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: agi-backend
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 1s
      retries: 5
    # TODO: Remove (dev purposes only)
    # NOTE: This maps host port 54320 to container port 5432
    ports:
      - "54320:5432"


  # ============================================================================================== #
  # ========== Frontend Service ================================================================== #
  # ============================================================================================== #
  frontend:
    image: agi-frontend
    container_name: frontend
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - inference-service
      - profiles-service
