services:
  # ============================================================================================== #
  # ========== Auth Service (Keycloak) =========================================================== #
  # ============================================================================================== #
  auth:
    image: quay.io/keycloak/keycloak:26.7.3
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=changeme
      - KC_DB=postgres
      - KC_DB_USERNAME=agi-auth-backend
      - KC_DB_PASSWORD=changeme
      - KC_DB_URL=jdbc:postgresql://backend-auth:5432/agi-auth-backend
    ports:
      - "8080:8080"
    command: start-dev
    depends_on:
      backend-auth:
        condition: service_healthy
  backend-auth:
    # ref: https://hub.docker.com/_/postgres
    image: postgres:18.6
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: agi-auth-backend
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: agi-auth-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 1s
      retries: 5
    ports:
      - "54321:5432"


  # ============================================================================================== #
  # ========== Inference Service ================================================================= #
  # ============================================================================================== #
  ollama:
    # ref: https://hub.docker.com/r/ollama/ollama
    image: ollama/ollama:0.34.1
    volumes:
      # - ollama_data:/root/.ollama
      - ./inference-service/ollama-init.sh:/ollama-init.sh
    entrypoint: ["/bin/sh", "/ollama-init.sh"]
    ports:
      - "11434:11434"

  inference-service:
    image: agi-inference-service
    build:
      context: ./inference-service
    ports:
      - "8000:8000"


  # ============================================================================================== #
  # ========== Profiles Catalog Service ========================================================== #
  # ============================================================================================== #
  backend:
    image: agi-backend
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://agi-backend:changeme@backend-database:5432/agi-backend
    ports:
      - "3000:3000"
    depends_on:
      backend-database:
        condition: service_healthy

  backend-database:
    # ref: https://hub.docker.com/_/postgres
    image: postgres:18.6
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    environment:
      POSTGRES_USER: agi-backend
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: agi-backend
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 1s
      retries: 5
    # TODO: Remove (dev purposes only)
    # NOTE: This maps host port 54320 to container port 5432
    ports:
      - "54320:5432"


  # ============================================================================================== #
  # ========== Frontend Service ================================================================== #
  # ============================================================================================== #
  frontend:
    image: agi-frontend
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend
