name: agi-project
services:
  # ============================================================================================== #
  # ========== Auth Service (Keycloak) =========================================================== #
  # ============================================================================================== #
  auth-service:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: auth-service
    environment:
      # Used to access the master realm
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USER}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}

      - KC_DB=postgres
      - KC_DB_USERNAME=${AUTH_DB_USER}
      - KC_DB_PASSWORD=${AUTH_DB_PASSWORD}
      - KC_DB_URL=jdbc:postgresql://auth-service-database:5432/${AUTH_DB_NAME}
    ports:
      - "${KEYCLOAK_HOST_PORT}:8080"
    command:
      - start-dev
      - --import-realm
      - --health-enabled=true
    volumes:
      # Volume with the initial permissions for the terraform client
      - ./authorization/import/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      # Opens a socket using fd 3, issues a GET request to the health endpoint
      # and redirects the output back to fd 3. Grep returns success if response
      # contains "200 OK", otherwise returns failed and retries.
      # NOTE: This is required because keycloak container doesnt have curl or wget
      # and therefore we need to use something simmilar to this. If something more
      # clean is found, change this!
      test:
        - CMD-SHELL
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000
          echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      auth-service-database:
        condition: service_healthy

  auth-service-database:
    # ref: https://hub.docker.com/_/postgres
    image: postgres:18.6
    container_name: auth-service-database
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 1s
      retries: 5
    ports:
      - "${AUTH_DB_HOST_PORT}:5432"


  # ============================================================================================== #
  # ========== Inference Service ================================================================= #
  # ============================================================================================== #
  inference-service:
    image: ${INFERENCE_SERVICE_IMAGE}
    build:
      context: ./inference-service
    container_name: inference-service
    environment:
      PORT: ${INFERENCE_CONTAINER_PORT}
      PROFILES_SERVICE_URL: http://profiles-service:${PROFILES_CONTAINER_PORT}
      MOVIES_SERVICE_URL: http://movies-service:${MOVIES_CONTAINER_PORT}
      MODEL_SERVER_URL: http://inference-service-ollama:11434
      KEYCLOAK_ISSUER: http://localhost:8080/realms/${KEYCLOAK_APP_REALM} # TODO: Why localhost???
      KEYCLOAK_JWKS_URL: http://auth-service:8080/realms/${KEYCLOAK_APP_REALM}/protocol/openid-connect/certs
      AUDIENCE: ${INFERENCE_AUDIENCE}
    ports:
      - "${INFERENCE_HOST_PORT}:${INFERENCE_CONTAINER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:${INFERENCE_CONTAINER_PORT}/health"]
      interval: 2s
      timeout: 1s
      retries: 5
    depends_on:
      profiles-service:
        condition: service_healthy
      movies-service:
        condition: service_healthy
      inference-service-ollama:
        condition: service_healthy

  inference-service-ollama:
    image: ${INFERENCE_OLLAMA_IMAGE_REPO}:${INFERENCE_OLLAMA_IMAGE_TAG}
    container_name: inference-service-ollama
    volumes:
      # - ollama_data:/root/.ollama
      - ./inference-service/ollama-init.sh:/ollama-init.sh
    entrypoint: ["/bin/sh", "/ollama-init.sh"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ollama list | awk '{print $1}' | grep -qx 'llama3.2:1b'"
        ]
      interval: 30s
      timeout: 3s
      retries: 60
      start_period: 30s
    ports:
      - "${OLLAMA_HOST_PORT}:11434"


  # ============================================================================================== #
  # ========== Profiles Catalog Service ========================================================== #
  # ============================================================================================== #
  profiles-service:
    image: ${PROFILES_SERVICE_IMAGE}
    build:
      context: ./profiles-service
    container_name: profiles-service
    environment:
      PORT: ${PROFILES_CONTAINER_PORT}
      DATABASE_URL: postgresql://${PROFILES_DB_USER}:${PROFILES_DB_PASSWORD}@profiles-service-database:5432/${PROFILES_DB_NAME}
      KEYCLOAK_ISSUER: http://localhost:8080/realms/${KEYCLOAK_APP_REALM} # TODO: Why localhost???
      KEYCLOAK_JWKS_URL: http://auth-service:8080/realms/${KEYCLOAK_APP_REALM}/protocol/openid-connect/certs
      AUDIENCE: ${PROFILES_AUDIENCE}
    ports:
      - "${PROFILES_HOST_PORT}:${PROFILES_CONTAINER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:${PROFILES_CONTAINER_PORT}/health"]
      interval: 2s
      timeout: 1s
      retries: 5
    depends_on:
      profiles-service-database:
        condition: service_healthy

  profiles-service-database:
    # ref: https://hub.docker.com/_/postgres
    image: postgres:18.6
    container_name: profiles-service-database
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${PROFILES_DB_USER}
      POSTGRES_PASSWORD: ${PROFILES_DB_PASSWORD}
      POSTGRES_DB: ${PROFILES_DB_NAME}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 1s
      retries: 5
    # TODO: Remove (dev purposes only)
    # NOTE: This maps a host port to container port 5432
    ports:
      - "${PROFILES_DB_HOST_PORT}:5432"


  # ============================================================================================== #
  # ========== Movies Catalog Service ============================================================ #
  # ============================================================================================== #
  movies-service:
    image: agi-movies-service
    build:
      context: ./movies-service
    container_name: movies-service
    environment:
      PORT: ${MOVIES_CONTAINER_PORT}
      DATABASE_URL: postgresql://${MOVIES_DB_USER}:${MOVIES_DB_PASSWORD}@movies-service-database:5432/${MOVIES_DB_NAME}
      KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_HOST_PORT}/realms/${KEYCLOAK_APP_REALM}
      KEYCLOAK_JWKS_URL: http://auth-service:8080/realms/${KEYCLOAK_APP_REALM}/protocol/openid-connect/certs
      AUDIENCE: ${MOVIES_AUDIENCE}
      DISABLE_AUTH: ${DISABLE_AUTH:-false}
    ports:
      - "${MOVIES_HOST_PORT}:${MOVIES_CONTAINER_PORT}"
    volumes:
      - ./movies-service/data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${MOVIES_CONTAINER_PORT}/health || exit 1"]
      interval: 2s
      timeout: 1s
      retries: 5
      start_period: 15s
    depends_on:
      movies-service-database:
        condition: service_healthy

  movies-service-database:
    # ref: https://hub.docker.com/_/postgres
    image: postgres:18.6
    container_name: movies-service-database
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${MOVIES_DB_USER}
      POSTGRES_PASSWORD: ${MOVIES_DB_PASSWORD}
      POSTGRES_DB: ${MOVIES_DB_NAME}
      PGDATA: /var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 1s
      retries: 5
    volumes:
      - movies_db_data:/var/lib/postgresql/data
    ports:
      - "${MOVIES_DB_HOST_PORT}:5432"


  # ============================================================================================== #
  # ========== Frontend Service ================================================================== #
  # ============================================================================================== #
  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: frontend
    build:
      context: ./frontend
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      APP_PORT: ${FRONTEND_HOST_PORT}
      PORT: ${FRONTEND_CONTAINER_PORT}
      PROFILES_SERVICE_INTERNAL_URL: http://profiles-service:${PROFILES_CONTAINER_PORT}/profiles
      INFERENCE_SERVICE_INTERNAL_URL: http://inference-service:${INFERENCE_CONTAINER_PORT}
      KEYCLOAK_URL: http://${APP_DOMAIN}:${KEYCLOAK_HOST_PORT}
      KEYCLOAK_APP_REALM: ${KEYCLOAK_APP_REALM}
      KEYCLOAK_APP_CLIENT_ID: ${KEYCLOAK_APP_CLIENT_ID}
    ports:
      - "${FRONTEND_HOST_PORT}:${FRONTEND_CONTAINER_PORT}"
    depends_on:
      profiles-service:
        condition: service_healthy
      inference-service:
        condition: service_healthy

volumes:
  movies_db_data:
