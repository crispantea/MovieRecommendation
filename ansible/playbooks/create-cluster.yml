---
- hosts: master
  become: yes
  connection: ssh
  become_method: sudo
  become_user: root
  tasks:
    - name: initialize the cluster
      shell: kubeadm reset --force && kubeadm init --pod-network-cidr=10.244.0.0/16 --ignore-preflight-errors=NumCPU --apiserver-cert-extra-sans={{ api_external_ip }} && touch /root/cluster_initialized.txt
      args:
        chdir: /root
        creates: /root/cluster_initialized.txt

    - name: create .kube directory
      file:
        path: /root/.kube
        state: directory
        mode: 0755

    - name: copies admin.conf to user's kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: yes

    - name: install Pod network
      shell: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.30.7/manifests/calico.yaml
      args:
        chdir: /root

    - name: Get the token for joining the worker nodes
      shell: kubeadm token create  --print-join-command
      register: kubernetes_join_command

    - name: Copy join command to local file
      become: no
      delegate_to: localhost
      copy:
        content: "{{ kubernetes_join_command.stdout }}"
        dest: /tmp/kubernetes_join_command
        mode: '0600'
    
    - name: fetch admin kubeconfig to local machine
      fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ playbook_dir }}/../../.kube/gcp-config"
        flat: true

    - name: point kubeconfig at the external IP
      become: no
      delegate_to: localhost
      replace:
        path: "{{ playbook_dir }}/../../.kube/gcp-config"
        regexp: 'server: https://.*:6443'
        replace: 'server: https://{{ api_external_ip }}:6443'