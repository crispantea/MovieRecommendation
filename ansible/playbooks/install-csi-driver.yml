---
# file: install-csi-driver.yml
# This Playbook installs and sets up the CSI driver.

- hosts: master
  gather_facts: no
  become: yes
  connection: ssh
  become_method: sudo
  become_user: root

  vars:
    cloud_sa_key_file: "{{ playbook_dir }}/../../infra/environments/dev/gcp/credentials.json"
    csi_namespace: gce-pd-csi-driver
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

  tasks:
    - name: Create CSI namespace
      ansible.builtin.shell: >
        kubectl create namespace {{ csi_namespace }}
        --dry-run=client -o yaml | kubectl apply -f -
 
    - name: Create cloud-sa secret (key is piped in, never written to the host)
      ansible.builtin.shell: >
        kubectl -n {{ csi_namespace }} create secret generic cloud-sa
        --from-file=cloud-sa.json=/dev/stdin
        --dry-run=client -o yaml | kubectl apply -f -
      args:
        stdin: "{{ lookup('file', cloud_sa_key_file) }}"
      no_log: true
 
    - name: Deploy CSI driver
      ansible.builtin.command: >
        kubectl apply -k
        "github.com/kubernetes-sigs/gcp-compute-persistent-disk-csi-driver/deploy/kubernetes/overlays/stable-master?ref=master"
 